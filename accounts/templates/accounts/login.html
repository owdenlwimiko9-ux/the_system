{% extends 'base.html' %}
{% block title %}Login - School System{% endblock %}

{% block content %}
<style>
    /* Force override base.html white background */
    html, body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        min-height: 100vh !important;
        margin: 0 !important;
    }
    /* Make container full height */
    .container { padding-top: 0 !important; margin-top: 0 !important; }
    
    .glass-card {
        background: rgba(255, 255, 255, 0.12) !important;
        backdrop-filter: blur(20px) !important;
        border-radius: 20px !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37) !important;
    }
    .form-control {
        background: rgba(255, 255, 255, 0.18) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 12px !important;
        padding: 12px 15px !important;
        color: white !important;
    }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.8) !important; }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.25) !important;
        border-color: white !important;
        box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25) !important;
        color: white !important;
    }
    label, h2, p { color: white !important; }
    .btn-login {
        background: rgba(255, 255, 255, 0.25) !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-radius: 12px !important;
        color: white !important;
        transition: all 0.3s !important;
    }
    .btn-login:hover {
        background: rgba(255, 255, 255, 0.35) !important;
        transform: translateY(-2px) !important;
        color: white !important;
    }
</style>

<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card glass-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill" style="font-size: 4rem; color: white;"></i>
                    <h2 class="fw-bold mt-3">School System</h2>
                    <p style="color: rgba(255,255,255,0.9);">Welcome Back</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger rounded-3" style="background: rgba(220,53,69,0.3) !important; border: 1px solid rgba(220,53,69,0.5) !important; color: white !important;">
                        <i class="bi bi-exclamation-triangle"></i> Wrong Cresssidentials
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-login w-100 py-3 fw-bold">
                        <i class="bi bi-arrow-right-circle"></i> SIGN IN
                    </button>
                </form>

                <div class="text-center mt-4">
                    <small style="color: rgba(255,255,255,0.8);">© 2026 School Management System</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
