<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}KILAMSA SCHOOLS{% endblock %}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:9999}
.nav-links{display:flex;gap:18px;align-items:center}
.nav-links a{text-decoration:none;color:#0c152d;font-size:14px;font-weight:500}
.btn-primary{background:#2563eb;color:white!important;padding:8px 14px;border-radius:8px}
#menu-toggle{display:none}
.hamburger{display:none;font-size:26px;cursor:pointer}
@media(max-width:768px){
.hamburger{display:block}
.nav-links{display:none;flex-direction:column;position:absolute;top:60px;left:0;right:0;background:white;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#menu-toggle:checked ~ .nav-links{display:flex!important}
.nav-links a{width:100%;padding:12px 0;border-bottom:1px solid #f1f5f9}
}
</style>
</head>
<body>

<nav class="navbar">
<div style="font-weight:bold;">KILAMSA <span style="color:#eab308;">SCHOOLS</span><br><small style="font-size:10px;color:#64748b;">Mlimba - Morogoro</small></div>
<input type="checkbox" id="menu-toggle">
<label for="menu-toggle" class="hamburger">☰</label>
<div class="nav-links">
<a href="/">Home</a>
<a href="/about/">About</a>
<a href="/programs/">Programs</a>
<a href="/admissions/">Admission</a>
<a href="/teachers/">Teachers</a>
<a href="/login/" class="btn-primary">School Management</a>
</div>
</nav>

{% block content %}{% endblock %}

<div style="background:#0c152d;color:#94a3b8;text-align:center;padding:20px;font-size:12px;margin-top:40px;">© 2026 KILAMSA Schools - Mlimba Morogoro | Odiztech</div>

</body>
</html>
