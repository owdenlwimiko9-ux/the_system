<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}KILAMSA SCHOOLS{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--navy:#0a1931;--gold:#FFC700;--blue:#2563eb}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);box-shadow:0 4px 30px rgba(0,0,0,.05);position:sticky;top:0;z-index:9999}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{text-decoration:none;color:var(--navy);font-size:14px;font-weight:600}
.btn-gold{background:var(--navy);color:var(--gold)!important;padding:10px 20px;border-radius:30px;font-weight:700}
#menu-toggle{display:none}.hamburger{display:none;font-size:26px;cursor:pointer}
@media(max-width:900px){.hamburger{display:block}.nav-links{display:none;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:white;padding:25px;box-shadow:0 20px 40px rgba(0,0,0,.1)}#menu-toggle:checked ~ .nav-links{display:flex}.nav-links a{width:100%;padding:14px 0;border-bottom:1px solid #f1f5f9}}
.badge{background:#e0f2fe;color:var(--blue);padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body style="background:#f8fafc;">
<nav class="navbar">
<div style="font-weight:800;color:var(--navy);line-height:1;">KILAMSA <span style="color:var(--blue);">SCHOOLS</span><br><small style="font-weight:600;letter-spacing:2px;font-size:9px;color:#64748b;">MLIMBA • MOROGORO</small></div>
<input type="checkbox" id="menu-toggle"><label for="menu-toggle" class="hamburger">☰</label>
<div class="nav-links">
<a href="/">Home</a><a href="/about/">About</a><a href="/#programs">Programs</a><a href="/admissions/">Admission</a><a href="/#teachers">Teachers</a><a href="/login/" class="btn-gold">Portal</a>
</div>
</nav>
{% block content %}{% endblock %}
<div style="background:#081229;color:#94a3b8;text-align:center;padding:30px 20px;margin-top:50px;">
<div style="color:white;font-weight:800;letter-spacing:2px;">KILAMSA SCHOOLS</div>
<div style="margin:8px 0;font-size:13px;">Mlimba - Morogoro • NECTA • Day & Boarding • Transport</div>
<div style="font-size:11px;margin-top:12px;">© 2026 KILAMSA | Excellence • Discipline • Integrity</div>
</div>
</body>
</html>
