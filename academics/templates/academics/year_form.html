{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white"><h5>{{ title }}</h5></div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Year Name</label>
                {{ form.name }}
            </div>
            <div class="mb-3 form-check">
                {{ form.is_active }}
                <label class="form-check-label">Set as Active Academic Year</label>
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'academics:year_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
