{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>{{ title }}</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="{{ form.level.id_for_label }}" class="form-label">Class / Level</label>
                    {{ form.level }}
                </div>
                
                <div class="mb-3">
                    <label for="{{ form.stream.id_for_label }}" class="form-label">Stream</label>
                    {{ form.stream }}
                </div>
                
                <div class="mb-3">
                    <label for="{{ form.class_teacher.id_for_label }}" class="form-label">Class Teacher</label>
                    {{ form.class_teacher }}
                </div>

                <button type="submit" class="btn btn-success">Save Class</button>
                <a href="{% url 'academics:class_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
