{% extends 'base_public.html' %}
{% block content %}
<div class="container py-5" style="max-width:600px;">
<div style="background:white; padding:30px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.08); border-top:5px solid #FFD700;">
<h2 style="color:#0c152d; font-weight:bold;">Admission Application</h2>
{% if messages %}{% for m in messages %}<div class="alert alert-success">{{m}}</div>{% endfor %}{% endif %}
<form method="post">{% csrf_token %}
<input class="form-control mb-2" name="full_name" placeholder="Student Full Name" required>
<input class="form-control mb-2" name="parent_name" placeholder="Parent Name" required>
<input class="form-control mb-2" name="parent_phone" placeholder="Parent Phone" required>
<select class="form-control mb-2" name="class_applying" required>
<option value="">Select Class</option>
<option>Baby Class</option><option>Pre-Primary</option><option>Primary</option><option>Form 1-4</option><option>Form 5-6</option>
</select>
<input class="form-control mb-2" name="previous_school" placeholder="Previous School">
<textarea class="form-control mb-2" name="message" placeholder="Message"></textarea>
<button class="btn w-100" style="background:#0c152d; color:#FFD700; font-weight:bold;">Submit Application</button>
</form>
</div>
</div>
{% endblock %}
