{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0 p-4">
        <h4 class="text-center mb-4 fw-bold">KILAMSA SCHOOLS - Admission Application</h4>
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Student Name *</label>
              <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Parent Name *</label>
              <input type="text" name="parent_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Parent Phone *</label>
              <input type="text" name="parent_phone" placeholder="07XX XXX XXX" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Class Applying *</label>
              <select name="class_applying" class="form-select" required>
                <option value="">Select</option>
                <option>Baby Class</option>
                <option>Middle Class</option>
                <option>Pre-Primary</option>
                <option>Class 1</option>
                <option>Class 2</option>
                <option>Class 3</option>
                <option>Class 4</option>
                <option>Class 5</option>
                <option>Class 6</option>
                <option>Class 7</option>
              </select>
            </div>
            <div class="col-12 mb-3">
              <label>Previous School</label>
              <input type="text" name="previous_school" class="form-control">
            </div>
            <div class="col-12 mb-3">
              <label>Message</label>
              <textarea name="message" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-dark w-100" style="background:#2c3e50;">Submit Application</button>
          <div class="text-center mt-2">
            <a href="{% url 'admissions:track' %}" style="font-size:13px;">Already applied? Track your status →</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
